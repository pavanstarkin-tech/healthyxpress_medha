<!DOCTYPE html>
<html>
<head>
  <!--

    it to work correctly.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.

  <base href="/healthyxpress_medha/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <title>HealthExpress AI — Intelligent Healthcare Platform</title>
  <meta name="description" content="AI-driven healthcare, 15-minute emergency medicine delivery, and ABDM integrated telehealth platform.">
  <link rel="manifest" href="manifest.json">
  <!-- Firebase Web SDK for Real Google Sign-In Popup with COOP Fallback -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCU7Psyt8Rl5kQScIDAavvleuyNjkhVFxo",
      authDomain: "healthexpress-1.firebaseapp.com",
      projectId: "healthexpress-1",
      storageBucket: "healthexpress-1.firebasestorage.app",
      messagingSenderId: "575738669292",
      appId: "1:575738669292:web:305a1fce4415b605c3ddc9",
      measurementId: "G-11RHHGM6T0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.addScope('profile');
    provider.addScope('email');
    provider.setCustomParameters({
      prompt: 'select_account'
    });

    window.triggerFirebaseGoogleSignIn = async function() {
      try {
        const timeoutPromise = new Promise((_, reject) =>
          setTimeout(() => reject(new Error('Google Sign-In popup timed out or blocked by browser COOP policy.')), 12000)
        );

        const signInPromise = signInWithPopup(auth, provider);
        const result = await Promise.race([signInPromise, timeoutPromise]);
        const user = result.user;
        const idToken = await user.getIdToken();
        return JSON.stringify({
          success: true,
          uid: user.uid,
          email: user.email,
          displayName: user.displayName || (user.email ? user.email.split('@')[0] : 'Google User'),
          photoURL: user.photoURL || '',
          idToken: idToken
        });
      } catch (error) {
        let msg = error.message || '';
        if (error.code === 'auth/popup-closed-by-user') {
          msg = 'Google Sign-In popup was closed before completing login.';
        } else if (error.code === 'auth/popup-blocked') {
          msg = 'The Google sign-in popup was blocked by your browser. Please allow popups for this site.';
        } else if (error.code === 'auth/unauthorized-domain' || (msg && msg.includes('unauthorized-domain'))) {
          msg = 'Domain not authorized in Firebase. Please add pavanstarkin-tech.github.io to Firebase Authentication -> Authorized domains.';
        } else if (error.code === 'auth/internal-error' || (msg && msg.includes('500')) || (msg && msg.includes('Cross-Origin-Opener-Policy'))) {
          msg = 'Cross-Origin policy prevented popup handshake. Please choose an account from the Google Account Chooser.';
        }
        return JSON.stringify({
          success: false,
          code: error.code || 'coop_or_network_error',
          message: msg
        });
      }
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
